<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f2f2f2;
      font-family: sans-serif;
    }

    /* Header */
    .topbar {
      background: white;
      padding: 15px 30px;
      font-weight: bold;
      font-size: 1.5rem;
      color: #666;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Banner */
    .banner {
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      color: white;
      padding: 60px 40px;
    }

    .banner h1 {
      font-weight: bold;
    }

    /* Cards */
    .card-box {
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #333;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card-img {
      width: 100%;
      height: auto;     /* ให้สูงตามภาพจริง */
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card1 { background: #f7e6a3; }
    .card2 { background: #d7e8b6; }
    .card3 { background: #d7e3e8; }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="topbar">
  </div>

  <!-- Banner -->
  <div class="banner">
    <div class="container">
      <h1>แบบฝึกหัด 8 การพัฒนาแอปด้วย Ionic ร่วมกับ Firebase AI Logic</h1>
    </div>
  </div>

  <!-- Cards -->
  <div class="container mt-5">
    <div class="row g-4">

      <!-- Card 1 -->
      <div class="col-md-4">
        <div class="card-box card1">
          <img
            src="screenshots/3.png"
            class="card-img"
            alt="feature1"
          />
          <h5>ตัวอย่างการวิเคราะห์ 1</h5>

        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4">
        <div class="card-box card2">
          <img
            src="screenshots/3.png"
            class="card-img"
            alt="feature2"
          />
          <h5>ตัวอย่างการวิเคราะห์ 2</h5>

        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4">
        <div class="card-box card3">
          <img
            src="screenshots/3.png"
            class="card-img"
            alt="feature3"
          />
          <h5>ตัวอย่างการวิเคราะห์ 3</h5>

        </div>
      </div>
  <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-transparent border-0">
          <div class="modal-body text-center">
            <img id="modalImage" src="" class="img-fluid rounded">
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    โดย:663380202-1 | Mobile Web Application Development
  </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const images = document.querySelectorAll(".card-img");
  const modalImage = document.getElementById("modalImage");
  const imageModal = new bootstrap.Modal(document.getElementById("imageModal"));

  images.forEach(img => {
    img.style.cursor = "pointer";
    img.addEventListener("click", () => {
      modalImage.src = img.src;
      imageModal.show();
    });
  });
</script>

</body>
</html>
